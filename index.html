<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clearwater Beach Wedding — Stay Options</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pacifico&family=Quicksand:wght@500;600;700&display=swap">
<style>
  :root{
    --sand: #faf3e3;
    --sand-deep: #f0dfba;
    --ink: #21414a;
    --ocean: #1b7a8c;
    --ocean-deep: #0f5866;
    --lagoon: #6fc2b4;
    --coral: #ff8566;
    --coral-deep: #e8623f;
    --line: #e3cf9e;
    --shell: #ffe3d1;
    --card-bg: #fffaf0;
    --venue-green: #3ea87a;
    --hotel-blue: #2f86b3;
  }
  *{box-sizing:border-box;}
  html{ font-size: 18px; } /* accessible base size — WCAG/AARP guidance for older-adult-friendly text is 16-18px minimum body copy */
  html,body{margin:0;padding:0;}
  body{
    font-family: 'Quicksand', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background-image:
      /* soft tint so header/search text stays legible over the photo */
      linear-gradient(180deg, rgba(250,243,227,0.6) 0%, rgba(250,243,227,0.35) 20%, rgba(15,88,102,0.25) 100%),
      /* real aerial palm/sand/turquoise photo — free-to-use under the Pexels License (Jess Loiterton) */
      url("https://images.pexels.com/photos/4602279/pexels-photo-4602279.jpeg?auto=compress&cs=tinysrgb&w=1600");
    background-repeat: no-repeat, no-repeat;
    background-position: center, center;
    background-size: cover, cover;
    background-attachment: fixed, fixed;
    color: var(--ink);
    min-height:100vh;
  }
  header{
    padding: 26px 18px 6px;
    text-align:center;
  }
  .hero-scrim{
    background: linear-gradient(180deg, rgba(10,30,35,0.42) 0%, rgba(10,30,35,0.28) 55%, rgba(10,30,35,0.12) 100%);
    padding-bottom: 14px;
  }
  header h1{
    margin:0;
    font-family: 'Pacifico', cursive;
    font-weight: 400;
    font-size: clamp(1.7rem, 5vw, 2.6rem);
    letter-spacing: 0.5px;
    color: #ffffff;
    text-shadow: 0 2px 6px rgba(0,0,0,0.35);
  }
  header p{
    margin: 8px 0 0;
    font-family: 'Quicksand', sans-serif;
    font-weight: 600;
    color: #ffffff;
    font-size: 1rem;
    text-shadow: 0 1px 4px rgba(0,0,0,0.3);
  }
  .layout{
    padding: 0 16px 48px;
    max-width: 1200px;
    margin: 0 auto;
  }

  #map{
    height: 66vh;
    min-height: 420px;
    max-height: 700px;
    width: 100%;
    border-radius: 14px;
    border: 3px solid var(--sand-deep);
    box-shadow: 0 4px 16px rgba(15,88,102,0.15);
  }
  .map-panel{
    width: 100%;
    background: #0a2e3d;
    padding: 14px;
    border-radius: 20px;
    box-shadow: 0 6px 22px rgba(0,0,0,0.3);
  }

  .legend{
    display:flex;
    gap: 20px;
    font-family: 'Quicksand', sans-serif;
    font-weight: 600;
    font-size: 1rem;
    color: #ffffff;
    text-shadow: 0 1px 4px rgba(0,0,0,0.35);
    padding: 10px 4px 0;
    justify-content:center;
    flex-wrap: wrap;
  }
  .legend span{ display:flex; align-items:center; gap:6px; }
  .legend .emoji{ font-size: 1.05rem; line-height:1; }
  .dot{ width:11px; height:11px; border-radius:50%; display:inline-block; border: 1.5px solid rgba(0,0,0,0.2); }
  .dot.green{ background: var(--venue-green); }
  .dot.blue{ background: var(--hotel-blue); }
  .dot.red{ background: var(--coral); }

  .search-bar{
    max-width: 1200px;
    margin: 14px auto 0;
    padding: 0 16px;
    display:flex;
    gap: 8px;
  }
  .search-input-wrap{
    position: relative;
    flex: 1;
  }
  .search-input-wrap input{
    width: 100%;
    font-family: 'Quicksand', sans-serif;
    font-weight: 600;
    font-size: 1.05rem;
    padding: 11px 16px;
    border: 2px solid var(--line);
    border-radius: 999px;
    background: #fffdf7;
    color: var(--ink);
  }
  .search-input-wrap input::placeholder{ color: #9caba9; font-weight: 500; }
  .search-input-wrap input:focus{ outline: none; border-color: var(--ocean); box-shadow: 0 0 0 3px rgba(27,122,140,0.15); }
  .suggestions{
    position: absolute;
    top: calc(100% + 6px);
    left: 0;
    right: 0;
    background: #fffdf7;
    border: 2px solid var(--line);
    border-radius: 16px;
    box-shadow: 0 6px 18px rgba(15,88,102,0.15);
    z-index: 1000;
    overflow: hidden;
    display: none;
  }
  .suggestions.open{ display: block; }
  .suggestion-item{
    padding: 10px 16px;
    font-family: 'Quicksand', sans-serif;
    font-weight: 600;
    font-size: 1rem;
    color: var(--ink);
    cursor: pointer;
    border-bottom: 1px solid var(--sand-deep);
  }
  .suggestion-item:last-child{ border-bottom: none; }
  .suggestion-item:hover, .suggestion-item.active{
    background: var(--shell);
  }
  .search-bar button{
    font-family: 'Quicksand', sans-serif;
    font-size: 1.05rem;
    font-weight: 700;
    padding: 11px 22px;
    border: none;
    border-radius: 999px;
    background: var(--ocean);
    color: #fff;
    cursor: pointer;
    box-shadow: 0 3px 0 var(--ocean-deep);
  }
  .search-bar button:hover{ background: var(--ocean-deep); box-shadow: 0 2px 0 var(--ocean-deep); }
  .search-bar button:active{ transform: translateY(2px); box-shadow: none; }
  .search-bar button:disabled{ opacity: 0.6; cursor: default; box-shadow: none; }
  .search-status{
    max-width: 1200px;
    margin: 6px auto 0;
    padding: 0 16px;
    font-family: 'Quicksand', sans-serif;
    font-weight: 600;
    font-size: 0.95rem;
    color: #ffffff;
    text-shadow: 0 1px 4px rgba(0,0,0,0.35);
    min-height: 1.2em;
  }

  /* Responsive tweaks */
  @media (max-width: 860px){
    #map{ height: 58vh; min-height: 380px; }
  }

  .leaflet-popup-content-wrapper{
    background: var(--card-bg);
    border-radius: 14px;
    box-shadow: 0 6px 20px rgba(15,88,102,0.2);
    border: 2px solid var(--shell);
  }
  .leaflet-popup-tip{ background: var(--card-bg); }
  .leaflet-popup-content{
    font-family: 'Quicksand', sans-serif;
    font-weight: 600;
    font-size: 1.05rem;
    line-height: 1.6;
    color: var(--ink);
    margin: 12px 14px;
  }
  .popup-title{
    font-family: 'Pacifico', cursive;
    font-weight: 400;
    font-size: 1.15rem;
    color: var(--ocean-deep);
    display: block;
    margin-bottom: 2px;
  }
  .popup-wave{
    color: var(--lagoon);
    letter-spacing: 2px;
    display: block;
    margin: 4px 0 6px;
    font-size: 0.9rem;
  }
  .popup-line{ display:block; margin: 2px 0; font-size: 0.95rem; }
  .popup-line.nowrap{ white-space: nowrap; }
  .popup-line .icon{ margin-right: 4px; }
  .cost-tag{
    display: inline-block;
    margin-top: 8px;
    padding: 5px 10px;
    background: var(--shell);
    border-radius: 999px;
    color: var(--coral-deep);
    font-size: 0.95rem;
    font-weight: 700;
  }
  .room-request{
    display: flex;
    gap: 6px;
    margin-top: 10px;
  }
  .room-request input{
    flex: 1;
    min-width: 0;
    font-family: 'Quicksand', sans-serif;
    font-weight: 600;
    font-size: 0.85rem;
    padding: 7px 10px;
    border: 2px solid var(--line);
    border-radius: 999px;
    background: #fffdf7;
    color: var(--ink);
  }
  .room-request input:focus{ outline: none; border-color: var(--ocean); }
  .room-request button{
    font-family: 'Quicksand', sans-serif;
    font-weight: 700;
    font-size: 0.8rem;
    padding: 7px 12px;
    border: none;
    border-radius: 999px;
    background: var(--coral);
    color: #fff;
    cursor: pointer;
    white-space: nowrap;
  }
  .room-request button:hover{ background: var(--coral-deep); }
  .room-request .sold-out{
    font-family: 'Quicksand', sans-serif;
    font-weight: 700;
    font-size: 0.85rem;
    color: var(--coral-deep);
  }
  .popup-line.requested-by{
    font-size: 0.82rem;
    color: #5a7a76;
    margin-top: 4px;
  }
  .leaflet-popup-content .directions-btn{
    display: block;
    margin-top: 10px;
    text-align: center;
    text-decoration: none;
    font-family: 'Quicksand', sans-serif;
    font-weight: 700;
    font-size: 0.92rem;
    color: #ffffff;
    background: var(--ocean);
    border-radius: 999px;
    padding: 8px 14px;
    box-shadow: 0 3px 0 var(--ocean-deep);
  }
  .leaflet-popup-content .directions-btn:visited{ color: #ffffff; }
  .leaflet-popup-content .directions-btn:active{ transform: translateY(2px); box-shadow: none; }

  /* Marker animations */
  .pin-drop{
    animation: pinDropIn 1.5s cubic-bezier(.34,1.56,.64,1) both;
  }
  @keyframes pinDropIn{
    0%   { transform: translateY(-90px) scale(0.7); opacity: 0; }
    70%  { transform: translateY(6px) scale(1.08); opacity: 1; }
    100% { transform: translateY(0) scale(1); }
  }
  .pin-glow{
    animation: pinGlowBreathe 2.4s ease-in-out infinite;
  }
  @keyframes pinGlowBreathe{
    0%, 100% { filter: drop-shadow(0 2px 3px rgba(0,0,0,0.45)) drop-shadow(0 0 0px rgba(62,168,122,0.9)); }
    50%      { filter: drop-shadow(0 2px 3px rgba(0,0,0,0.45)) drop-shadow(0 0 12px rgba(62,168,122,0.95)); }
  }
</style>
</head>
<body>

<div class="hero-scrim">
  <div style="padding: 10px 16px 0;">
    <a href="rsvp.html" style="font-family:'Quicksand',sans-serif;font-weight:700;font-size:0.85rem;color:#ffffff;text-decoration:none;text-shadow:0 1px 4px rgba(0,0,0,0.35);">← Back to RSVP</a>
  </div>
  <header>
    <h1>Clearwater Beach — Where to Stay</h1>
    <p>Distances measured from the JW Marriott (wedding venue) · driving &amp; walking times via live routing</p>
  </header>

  <div class="legend">
    <span><span class="emoji">🏝️</span> Wedding venue</span>
    <span><span id="legendShellIcon"></span> Places to stay</span>
    <span><span class="emoji">🐬</span> Your search</span>
  </div>

  <div class="search-bar">
    <div class="search-input-wrap">
      <input type="text" id="searchInput" placeholder="Search an address or place…" autocomplete="off">
      <div id="suggestions" class="suggestions"></div>
    </div>
    <button id="searchBtn">Search</button>
  </div>
  <div id="searchStatus" class="search-status"></div>
</div>

<div class="layout">
  <div class="map-panel">
    <div id="map"></div>
  </div>
</div>

<script>
// ---- Data: coordinates are static / non-editable ----
const WEDDING = {
  name: "JW Marriott Clearwater Beach",
  lat: 27.9659180, lng: -82.8245772,
  costPerNight: null,
  resortFee: null,
  parkingFee: null
};

const LOCATIONS = [
  { name: "Ivory Sands",                          lat: 27.9700130, lng: -82.8286542 },
  { name: "Holiday Inn",                          lat: 27.967818,  lng: -82.828300,
    roomsLeft: 20 },
  { name: "Shephard's Beach Resort",               lat: 27.966919,  lng: -82.827134  },
  { name: "Courtyard by Marriott",                lat: 27.9802429, lng: -82.8255345,
    roomsLeft: 5 },
  { name: "AC Hotel",                              lat: 27.9714545, lng: -82.8284936 },
  { name: "Pier House 60",                        lat: 27.975455,  lng: -82.827909,
    costPerNight: 229, resortFee: 37, parkingFee: 0, totalPerNight: 300.58 }
];

// Cost/rooms/link fields left as placeholders where not already set above.
LOCATIONS.forEach(loc => {
  if (loc.costPerNight === undefined) loc.costPerNight = null;
  if (loc.resortFee === undefined) loc.resortFee = null;
  if (loc.parkingFee === undefined) loc.parkingFee = null;
  if (loc.roomsLeft === undefined) loc.roomsLeft = 10; // default block size unless overridden above
  if (loc.bookingLink === undefined) loc.bookingLink = null; // set a URL here once a hotel's booking link is known
});

// ---- Haversine straight-line distance (miles), for instant display ----
function haversineMiles(lat1, lon1, lat2, lon2){
  const R = 3958.8;
  const toRad = d => d * Math.PI / 180;
  const dLat = toRad(lat2 - lat1);
  const dLon = toRad(lon2 - lon1);
  const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLon/2)**2;
  const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
  return R * c;
}

LOCATIONS.forEach(loc => {
  loc.straightLineMiles = haversineMiles(WEDDING.lat, WEDDING.lng, loc.lat, loc.lng);
});

// ---- Map setup ----
const map = L.map('map', { scrollWheelZoom: true }).setView([WEDDING.lat, WEDDING.lng], 16);

// Satellite imagery base (Esri World Imagery — free, no API key required)
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
  maxZoom: 19,
  attribution: 'Tiles &copy; Esri &mdash; Source: Esri, Maxar, Earthstar Geographics'
}).addTo(map);

// Road/place-name labels layered on top of the imagery, like Google's "hybrid" view
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}', {
  maxZoom: 19,
  opacity: 0.9
}).addTo(map);

function themedIcon(emoji, animClass){
  return L.divIcon({
    className: '',
    html: `<div class="${animClass || ''}" style="
            width:40px;height:40px;
            display:flex;align-items:center;justify-content:center;
            font-size:30px;line-height:1;
            filter: drop-shadow(0 2px 3px rgba(0,0,0,0.45));">${emoji}</div>`,
    iconSize: [40,40],
    iconAnchor: [20,20],
    popupAnchor: [0,-20]
  });
}

const SHELL_HULL_PATH = "M 534.5,591.3 L 505.2,600.1 L 395.2,602.7 L 303.7,601.6 L 296.4,601.3 L 277.9,598.1 L 166.0,485.2 L 144.2,456.0 L 159.1,386.5 L 164.4,368.6 L 168.1,356.3 L 187.2,311.2 L 195.2,292.9 L 242.1,236.5 L 265.7,216.0 L 279.0,208.2 L 367.2,181.2 L 378.6,178.5 L 407.3,178.3 L 433.6,183.7 L 500.2,203.3 L 513.8,207.6 L 579.9,245.0 L 588.8,254.6 L 603.4,282.1 L 627.4,333.2 L 646.6,424.3 L 646.9,438.0 L 642.4,452.4 L 637.6,467.9 Z";

function shellIcon(animClass){
  return L.divIcon({
    className: '',
    html: `<div class="${animClass || ''}" style="width:52px;height:52px;filter: drop-shadow(0 2px 3px rgba(0,0,0,0.45));">
      <svg width="52" height="52" viewBox="0 0 784 784">
        <path d="${SHELL_HULL_PATH}" fill="#bfe3f0"/>
        <path d="${SHELL_PATH}" fill="#2f86b3" stroke="#134a63" stroke-width="12" stroke-linejoin="round"/>
      </svg>
    </div>`,
    iconSize: [52,52],
    iconAnchor: [26,26],
    popupAnchor: [0,-26]
  });
}

const greenIcon = themedIcon('🏝️', 'pin-glow');
const blueIcon = shellIcon('pin-drop');

document.getElementById('legendShellIcon').innerHTML =
  `<svg width="18" height="18" viewBox="0 0 784 784" style="vertical-align:-3px;"><path d="${SHELL_HULL_PATH}" fill="#bfe3f0"/><path d="${SHELL_PATH}" fill="#2f86b3" stroke="#134a63" stroke-width="12" stroke-linejoin="round"/></svg>`;

// Shared popup behavior: fixed size so it can't dominate the map, and no auto-panning
// so opening a popup doesn't shift/move the map view underneath it.
const POPUP_OPTS = { maxWidth: 280, minWidth: 230, autoPan: false, keepInView: false };

const boundsPoints = [[WEDDING.lat, WEDDING.lng]];

L.marker([WEDDING.lat, WEDDING.lng], { icon: greenIcon })
  .addTo(map)
  .bindPopup(`
    <span class="popup-title">🏝️ ${WEDDING.name}</span>
    <span class="popup-wave">〜 〜 〜</span>
    <span class="popup-line">Wedding ceremony &amp; reception venue</span>
    <span class="cost-tag">🏝️ ${fmtCost(WEDDING.costPerNight)}/night · resort ${fmtCost(WEDDING.resortFee)} · parking ${fmtCost(WEDDING.parkingFee)}</span>
  `, POPUP_OPTS);

function fmtCost(v){
  return (v === null || v === undefined) ? 'TBD' : `$${v}`;
}

function popupHtml(loc, idx){
  const soldOut = loc.roomsLeft <= 0;
  const requestedByLine = (loc.selections && loc.selections.length)
    ? `<span class="popup-line requested-by">Requested: ${loc.selections.join(', ')}</span>`
    : '';
  return `
    <span class="popup-title"><svg viewBox="0 0 784 784" style="width:1em;height:1em;vertical-align:-0.12em;"><path d="${SHELL_HULL_PATH}" fill="#bfe3f0"/><path d="${SHELL_PATH}" fill="#2f86b3" stroke="#134a63" stroke-width="12" stroke-linejoin="round"/></svg> ${loc.name}</span>
    <span class="popup-wave">〜 〜 〜</span>
    <span class="popup-line nowrap"><span class="icon">🚗</span>Drive: ${loc.driveText || 'calculating…'}</span>
    <span class="popup-line nowrap"><span class="icon">🚶</span>Walk: ${loc.walkText || 'calculating…'}</span>
    <span class="popup-line nowrap"><span class="icon">🛏️</span>${loc.roomsLeft} room${loc.roomsLeft === 1 ? '' : 's'} left in block</span>
    <span class="cost-tag">${fmtCost(loc.costPerNight)}/night · resort ${fmtCost(loc.resortFee)} · parking ${fmtCost(loc.parkingFee)}${loc.totalPerNight ? ` · total ~$${loc.totalPerNight}/night incl. tax` : ''}</span>
    ${loc.bookingLink ? `<a class="directions-btn" href="${loc.bookingLink}" target="_blank" rel="noopener">🔗 Book This Hotel</a>` : ''}
    <div class="room-request">
      ${soldOut
        ? `<span class="sold-out">Room block full</span>`
        : `<input type="text" id="guestName-${idx}" placeholder="Your name" maxlength="40" onkeydown="if(event.key==='Enter') requestRoom(${idx})">
           <button onclick="requestRoom(${idx})">I want this room</button>`
      }
    </div>
    ${requestedByLine}
  `;
}

// Guest room-request handler. This currently keeps state only in this browser tab/session —
// TODO once Supabase is wired up: replace the roomsLeft-- / selections.push below with an
// insert into a `room_selections` table (guest name, hotel, timestamp), then re-fetch the
// live remaining-rooms count for this hotel from a query instead of decrementing locally.
function requestRoom(idx){
  const loc = LOCATIONS[idx];
  const input = document.getElementById(`guestName-${idx}`);
  const name = input.value.trim();
  if (!name){
    input.focus();
    return;
  }
  if (loc.roomsLeft <= 0) return;

  loc.roomsLeft -= 1;
  loc.selections = loc.selections || [];
  loc.selections.push(name);

  loc.marker.setPopupContent(popupHtml(loc, idx));
}

LOCATIONS.forEach((loc, idx) => {
  boundsPoints.push([loc.lat, loc.lng]);
  loc.marker = L.marker([loc.lat, loc.lng], { icon: blueIcon })
    .addTo(map)
    .bindPopup(popupHtml(loc, idx), POPUP_OPTS);
});

map.fitBounds(boundsPoints, { padding: [40,40] });

// ---- Live driving & walking distances via public OSRM routing servers ----
// Free, no API key. Rate-limited to ~1 request/sec — requests are sent sequentially with a delay.
async function fetchRoute(profile, from, to){
  const url = `https://routing.openstreetmap.de/routed-${profile}/route/v1/${profile === 'car' ? 'driving' : 'foot'}/${from.lng},${from.lat};${to.lng},${to.lat}?overview=false`;
  const res = await fetch(url);
  if (!res.ok) throw new Error('routing request failed');
  const data = await res.json();
  if (!data.routes || !data.routes.length) throw new Error('no route');
  const route = data.routes[0];
  return {
    miles: route.distance / 1609.34,
    minutes: route.duration / 60
  };
}

function sleep(ms){ return new Promise(r => setTimeout(r, ms)); }

async function loadRealDistances(){
  for (let i = 0; i < LOCATIONS.length; i++){
    const loc = LOCATIONS[i];

    try{
      const drive = await fetchRoute('car', WEDDING, loc);
      loc.driveText = `${drive.miles.toFixed(2)} mi · ${Math.round(drive.minutes)} min`;
    }catch(e){
      loc.driveText = 'unavailable';
    }
    loc.marker.setPopupContent(popupHtml(loc));
    await sleep(1100);

    try{
      const walk = await fetchRoute('foot', WEDDING, loc);
      loc.walkText = `${walk.miles.toFixed(2)} mi · ${Math.round(walk.minutes)} min`;
    }catch(e){
      loc.walkText = 'unavailable';
    }
    loc.marker.setPopupContent(popupHtml(loc));
    await sleep(1100);
  }
}
loadRealDistances();

// ---- Search bar: autocomplete + geocode an address, drop a red marker, show distance to venue ----
const redIcon = themedIcon('🐬', 'pin-drop');
let searchMarker = null;

function directionsLink(place){
  const url = `https://www.google.com/maps/dir/?api=1&origin=${place.lat},${place.lng}&destination=${WEDDING.lat},${WEDDING.lng}`;
  return `<a class="directions-btn" href="${url}" target="_blank" rel="noopener">🧭 Get Directions to Venue</a>`;
}

const searchInput = document.getElementById('searchInput');
const searchBtn = document.getElementById('searchBtn');
const searchStatus = document.getElementById('searchStatus');
const suggestionsBox = document.getElementById('suggestions');

// Soft geographic bias: roughly Pinellas County + a ~1 hour drive radius around the venue.
// (left/lon-min, top/lat-max, right/lon-max, bottom/lat-min) — bounded=0 means this is a
// preference, not a hard cutoff, so a guest can still search further out if needed.
const SEARCH_VIEWBOX = '-83.64,28.69,-82.00,27.25';

let activeSuggestionIndex = -1;
let currentSuggestions = [];
let debounceTimer = null;

async function fetchSuggestions(query){
  const url = `https://nominatim.openstreetmap.org/search?format=json&limit=5&addressdetails=0` +
              `&countrycodes=us&viewbox=${SEARCH_VIEWBOX}&bounded=0&q=${encodeURIComponent(query)}`;
  const res = await fetch(url);
  if (!res.ok) throw new Error('autocomplete request failed');
  return res.json();
}

function renderSuggestions(results){
  currentSuggestions = results;
  activeSuggestionIndex = -1;

  if (!results.length){
    suggestionsBox.classList.remove('open');
    suggestionsBox.innerHTML = '';
    return;
  }

  suggestionsBox.innerHTML = results.map((r, i) =>
    `<div class="suggestion-item" data-index="${i}">${r.display_name}</div>`
  ).join('');
  suggestionsBox.classList.add('open');

  suggestionsBox.querySelectorAll('.suggestion-item').forEach(el => {
    el.addEventListener('click', () => {
      const chosen = currentSuggestions[parseInt(el.dataset.index, 10)];
      selectSuggestion(chosen);
    });
  });
}

function closeSuggestions(){
  suggestionsBox.classList.remove('open');
  suggestionsBox.innerHTML = '';
  currentSuggestions = [];
  activeSuggestionIndex = -1;
}

function selectSuggestion(result){
  searchInput.value = result.display_name;
  closeSuggestions();
  runSearch({
    lat: parseFloat(result.lat),
    lng: parseFloat(result.lon),
    label: result.display_name
  });
}

searchInput.addEventListener('input', () => {
  const query = searchInput.value.trim();
  clearTimeout(debounceTimer);

  if (query.length < 3){
    closeSuggestions();
    return;
  }

  debounceTimer = setTimeout(async () => {
    try{
      const results = await fetchSuggestions(query);
      renderSuggestions(results);
    }catch(e){
      closeSuggestions();
    }
  }, 400); // debounced to stay within Nominatim's ~1 request/sec usage policy
});

searchInput.addEventListener('keydown', (e) => {
  if (!suggestionsBox.classList.contains('open')){
    if (e.key === 'Enter') runSearch();
    return;
  }

  const items = suggestionsBox.querySelectorAll('.suggestion-item');
  if (e.key === 'ArrowDown'){
    e.preventDefault();
    activeSuggestionIndex = Math.min(activeSuggestionIndex + 1, items.length - 1);
    items.forEach((el, i) => el.classList.toggle('active', i === activeSuggestionIndex));
  }else if (e.key === 'ArrowUp'){
    e.preventDefault();
    activeSuggestionIndex = Math.max(activeSuggestionIndex - 1, 0);
    items.forEach((el, i) => el.classList.toggle('active', i === activeSuggestionIndex));
  }else if (e.key === 'Enter'){
    e.preventDefault();
    if (activeSuggestionIndex >= 0 && currentSuggestions[activeSuggestionIndex]){
      selectSuggestion(currentSuggestions[activeSuggestionIndex]);
    }else{
      closeSuggestions();
      runSearch();
    }
  }else if (e.key === 'Escape'){
    closeSuggestions();
  }
});

document.addEventListener('click', (e) => {
  if (!e.target.closest('.search-input-wrap')){
    closeSuggestions();
  }
});

async function geocode(query){
  const url = `https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=us` +
              `&viewbox=${SEARCH_VIEWBOX}&bounded=0&q=${encodeURIComponent(query)}`;
  const res = await fetch(url);
  if (!res.ok) throw new Error('geocoding request failed');
  const results = await res.json();
  if (!results.length) throw new Error('no results');
  return {
    lat: parseFloat(results[0].lat),
    lng: parseFloat(results[0].lon),
    label: results[0].display_name
  };
}

async function runSearch(preResolvedPlace){
  const query = searchInput.value.trim();
  if (!preResolvedPlace && !query) return;

  closeSuggestions();
  searchBtn.disabled = true;
  searchStatus.textContent = preResolvedPlace ? 'Locating…' : 'Searching…';

  try{
    const place = preResolvedPlace || await geocode(query);

    if (searchMarker){
      map.removeLayer(searchMarker);
    }

    searchMarker = L.marker([place.lat, place.lng], { icon: redIcon })
      .addTo(map)
      .bindPopup(`
        <span class="popup-title">🐬 ${place.label}</span>
        <span class="popup-wave">〜 〜 〜</span>
        <span class="popup-line">Calculating distance to venue…</span>
        ${directionsLink(place)}
      `, POPUP_OPTS)
      .openPopup();

    map.setView([place.lat, place.lng], 15);
    searchStatus.textContent = 'Getting driving & walking distance…';

    let driveText = 'unavailable';
    let walkText = 'unavailable';
    try{
      const drive = await fetchRoute('car', place, WEDDING);
      driveText = `${drive.miles.toFixed(2)} mi · ${Math.round(drive.minutes)} min`;
    }catch(e){}
    await sleep(1100);
    try{
      const walk = await fetchRoute('foot', place, WEDDING);
      walkText = `${walk.miles.toFixed(2)} mi · ${Math.round(walk.minutes)} min`;
    }catch(e){}

    searchMarker.setPopupContent(`
      <span class="popup-title">🐬 ${place.label}</span>
      <span class="popup-wave">〜 〜 〜</span>
      <span class="popup-line nowrap"><span class="icon">🚗</span>Drive: ${driveText}</span>
      <span class="popup-line nowrap"><span class="icon">🚶</span>Walk: ${walkText}</span>
      ${directionsLink(place)}
    `);
    searchStatus.textContent = '';
  }catch(e){
    searchStatus.textContent = 'Could not find that location — try a more specific address.';
  }finally{
    searchBtn.disabled = false;
  }
}

searchBtn.addEventListener('click', () => runSearch());
</script>
